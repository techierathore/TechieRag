<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TechieDesk</title>
    <base href="/" />
    <!-- Theme variables MUST come before TrBlazeUI component CSS -->
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="_content/TrBlazeUI.Components/trblazeui.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <!-- REQ-NFR-006: loaded AFTER the TrBlazeUI bundle so these fill gaps in it rather than being
         overridden by it, and BEFORE the per-component isolated styles so a page can still win. -->
    <link rel="stylesheet" href="styles/responsive.css" />
    <link rel="stylesheet" href="styles/utilities.css" />
    <link rel="stylesheet" href="TechieDesk.styles.css" />
    <!--
      REQ-UI-038 (BRD-90): first-paint theme shim. The chosen theme lives in the app database (see
      AppearanceStore), which cannot be read before the Blazor runtime has started — so without this
      a dark-mode install renders a full white window for the second or so it takes to boot, then
      snaps to dark. This replays the LAST APPLIED choice from the WebView's own storage so the first
      frame is already right; wwwroot/js/theme.js overwrites it from the database moments later and
      rewrites the cache. It is a paint cache, never the store of record — clearing it costs one
      white frame and nothing else. Inline and synchronous on purpose: a deferred or external script
      would run after the first paint, which is the entire thing being avoided.
    -->
    <script>
        // REQ-UI-050: apply the saved interface scale before first paint, for the same reason the
        // theme shim below exists — otherwise the window renders once at the default size and then
        // visibly jumps when the module loads.
        (function () {
            try {
                var scale = parseFloat(window.localStorage.getItem('td-ui-scale'));
                if (!isFinite(scale)) return;
                scale = Math.min(2.0, Math.max(0.8, scale));
                document.documentElement.style.setProperty('--td-ui-scale', String(scale));
            } catch (e) { /* a blocked store must never cost a readable window */ }
        })();
    </script>
    <script>
        (function () {
            try {
                var raw = window.localStorage.getItem('td-theme-cache');
                if (!raw) return;
                var cached = JSON.parse(raw);
                var dark = cached.mode === 'dark' || (cached.mode === 'system'
                    && window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches);
                var root = document.documentElement;
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                root.classList.toggle('dark', dark);
                if (cached.lightPrimary) {
                    root.style.setProperty('--td-accent-light', cached.lightPrimary);
                    root.style.setProperty('--td-accent-light-fg', cached.lightForeground);
                    root.style.setProperty('--td-accent-dark', cached.darkPrimary);
                    root.style.setProperty('--td-accent-dark-fg', cached.darkForeground);
                }
            } catch (e) {
                // A corrupt or unavailable cache must never stop the app from loading.
            }
        })();
    </script>
</head>

<body>
    <!--
      REQ-FN-035: the BlazorWebView root. This replaces Components/App.razor, which was the Blazor
      Server root component and carried @rendermode="InteractiveServer" — a render mode that only
      exists where there is a SignalR circuit. A Hybrid head runs the components in-process, so there
      is no render mode to declare and no blazor.web.js negotiation; blazor.webview.js is the host
      channel instead.
    -->
    <div id="app">Loading&hellip;</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>

    <!-- REQ-UI-050: the Cmd/Ctrl +/-/0 handler. Plain module rather than a Blazor component
         because it must work on every route including before the app has finished starting, and it
         needs nothing from .NET. -->
    <script type="module">
        import { initialize } from './js/zoom.js';
        initialize();
    </script>

    <!-- REQ-NFR-005 / TR-008: marks TrBlazeUI's own nameless icons decorative. Loaded here rather
         than from a layout because the components it corrects appear on every route including the
         auth screens, and it needs nothing from .NET. -->
    <script type="module">
        import { initialize } from './js/a11y.js';
        initialize();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
