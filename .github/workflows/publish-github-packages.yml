name: Build and Publish NuGet Packages

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g., preview, beta). Leave empty for release.'
        required: false
        default: ''

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Workflow-level permissions
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="1.0.0"
            if [[ -n "${{ github.event.inputs.version_suffix }}" ]]; then
              VERSION="${VERSION}-${{ github.event.inputs.version_suffix }}.${{ github.run_number }}"
            elif [[ "${{ github.ref }}" != refs/tags/* ]]; then
              VERSION="${VERSION}-preview.${{ github.run_number }}"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Every packable project is listed by path, in the same order, in Restore, Build and Pack - and
      # in publish-nuget.yml - so all packages ship together at one version (REQ-FN-005, REQ-FN-065).
      - name: Restore dependencies
        run: |
          dotnet restore src/TechieRag/TechieRag.csproj
          dotnet restore src/TechieRag.Embedded/TechieRag.Embedded.csproj
          dotnet restore src/TechieRag.Telemetry/TechieRag.Telemetry.csproj
          dotnet restore src/TechieRag.Agents/TechieRag.Agents.csproj
          dotnet restore src/TechieRag.Local/TechieRag.Local.csproj

      - name: Build
        run: |
          dotnet build src/TechieRag/TechieRag.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/TechieRag.Embedded/TechieRag.Embedded.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/TechieRag.Telemetry/TechieRag.Telemetry.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/TechieRag.Agents/TechieRag.Agents.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          dotnet build src/TechieRag.Local/TechieRag.Local.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Run tests
        # Blocking gate: test failures fail the build and prevent publish.
        # Only the library test project is built/tested — the sample (samples/TechieRagWeb)
        # cannot restore in CI (private TrBlazeUI feed), so never test the .slnx or globs.
        run: dotnet test tests/TechieRag.Tests/TechieRag.Tests.csproj --configuration Release --verbosity normal

      - name: Pack NuGet packages
        run: |
          dotnet pack src/TechieRag/TechieRag.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs
          dotnet pack src/TechieRag.Embedded/TechieRag.Embedded.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs
          dotnet pack src/TechieRag.Telemetry/TechieRag.Telemetry.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs
          dotnet pack src/TechieRag.Agents/TechieRag.Agents.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs
          dotnet pack src/TechieRag.Local/TechieRag.Local.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkgs

      - name: List created packages
        run: ls -la ./nupkgs/

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
          retention-days: 30

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    # Run on push to main/master or on tags, also allow manual trigger
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      packages: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: List downloaded packages
        run: ls -la ./nupkgs/

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in ./nupkgs/*.nupkg; do
            echo "Publishing $package..."
            dotnet nuget push "$package" --source "github" --skip-duplicate --api-key ${{ secrets.GITHUB_TOKEN }}
          done

  # There is deliberately NO nuget.org job in this workflow (REQ-FN-067 / BRD-160, DECISIONS.md
  # 2026-09-03 second entry). A v* tag lands on GitHub Packages only; nuget.org receives a version
  # solely through a human dispatching publish-nuget.yml (Trusted Publishing / OIDC) against that tag.
  # The former `publish-nuget-org` job, gated on a NUGET_API_KEY secret, was a second path to the
  # public feed and was removed on 2026-09-24. Do not re-add one - see NUGET-PUBLISHING.md §1.
