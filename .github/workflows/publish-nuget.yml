# Public release pipeline: NuGet.org via Trusted Publishing (OIDC).
#
# This workflow is deliberately SEPARATE from publish-github-packages.yml, which remains the
# internal day-to-day feed (GitHub Packages, private, every merge to main and every release tag).
# NOTHING HERE RUNS AUTOMATICALLY (DECISIONS.md 2026-09-03, second entry). A public release is a
# human opening Actions -> "Run workflow", entering the release tag as `ref`, and clicking - the
# same ceremony as the owner's other libraries: publish the GitHub Release (which creates the v*
# tag and feeds GitHub Packages), then dispatch this workflow against that tag. A REAL run needs
# `ref` to be (or sit exactly on) a `v*` tag; a DRY run may use any ref and packs a throwaway
# `-dryrun.N` version for inspection.
#
# THE VERSION COMES FROM THE TAG, NEVER FROM THE CSPROJ. The csproj `<Version>` is a standing
# development number (1.0.0) that was never bumped, and before 2026-09-03 this workflow packed
# whatever it found there and pushed with --skip-duplicate — so every run after the first one
# re-packed 1.0.0 and silently no-op'd (nuget.org sat at 1.0.0 while tags reached v1.0.6).
# Now: `Determine version` derives it from the tag, refuses a version nuget.org already has,
# refuses one that is not greater than the latest published, and the push no longer carries
# --skip-duplicate, so a duplicate that somehow got this far fails loudly instead of vanishing.
#
# The file NAME matters. The trusted publishing policy registered on nuget.org is bound to
# (repository, workflow file name) = (techierathore/TechieRag, publish-nuget.yml). Renaming or
# moving this file invalidates the policy until it is updated in the nuget.org UI.
#
# No API key is stored anywhere. NuGet/login@v1 exchanges the job's GitHub OIDC token for a
# temporary nuget.org key that is valid for ~1 hour and can be minted from that token exactly
# once - which is why the login step sits immediately before the push, after every gate has
# already passed.
#
# See NUGET-PUBLISHING.md at the repo root for the full runbook.

name: Publish to NuGet.org (Trusted Publishing)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to publish (e.g. v1.0.7). A real run requires a v* tag; a branch/SHA is accepted only with dry_run.'
        required: true
        default: 'main'
      dry_run:
        description: 'Dry run: build, test, pack and inspect the packages, then stop. No OIDC login, no push.'
        type: boolean
        required: true
        default: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_ORG_SOURCE: https://api.nuget.org/v3/index.json
  CORE_PROJECT: src/TechieRag/TechieRag.csproj
  EMBEDDED_PROJECT: src/TechieRag.Embedded/TechieRag.Embedded.csproj
  TEST_PROJECT: tests/TechieRag.Tests/TechieRag.Tests.csproj
  # Package IDs whose published versions gate the increment check (lower-case, as the flat
  # container API keys them). Both ship together at the same version.
  PACKAGE_IDS: techierag techierag.embedded

jobs:
  publish:
    name: Pack and publish to NuGet.org
    runs-on: ubuntu-latest

    permissions:
      # Required for GitHub to issue the OIDC token that NuGet/login exchanges for a temp key.
      id-token: write
      contents: read

    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # Pure bash on purpose - no `${{ }}` inside the script - so the exact same logic can be
        # replayed locally: `GITHUB_REF=refs/tags/v1.0.7 GITHUB_REF_NAME=v1.0.7 bash <this script>`.
        # tests/verify/publish-nuget-version.sh does exactly that.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          bash .github/workflows/scripts/determine-version.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore "$CORE_PROJECT"
          dotnet restore "$EMBEDDED_PROJECT"
          dotnet restore "$TEST_PROJECT"

      - name: Build
        # -p:Version on every dotnet invocation below, so the assembly version, the test build and
        # the nuspec all carry the SAME number. Passing it only to `pack --no-build` would ship an
        # assembly stamped 1.0.0 inside a package labelled with the tag.
        run: |
          dotnet build "$CORE_PROJECT"     --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }}
          dotnet build "$EMBEDDED_PROJECT" --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        # Blocking gate: no green tests, no public release.
        # Only the library test project is built/tested - the sample (apps/TechieDesk) cannot
        # restore in CI (private TrBlazeUI feed), so never test the .slnx or a glob.
        run: dotnet test "$TEST_PROJECT" --configuration Release --verbosity normal -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: |
          dotnet pack "$CORE_PROJECT"     --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }} --output ./artifacts
          dotnet pack "$EMBEDDED_PROJECT" --configuration Release --no-build -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.version }} --output ./artifacts

      - name: Confirm packed version
        id: pkg
        # The packed file names must carry exactly the version `Determine version` decided on.
        # A mismatch here means a csproj property fought the -p:Version override - stop.
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for id in TechieRag TechieRag.Embedded; do
            pkg="./artifacts/${id}.${EXPECTED}.nupkg"
            if [ ! -f "$pkg" ]; then
              echo "::error::Expected $pkg but the pack step produced:"; ls -1 ./artifacts/; exit 1
            fi
          done
          echo "version=$EXPECTED" >> "$GITHUB_OUTPUT"

          echo "=============================================="
          echo "  PUBLISHING TechieRag + TechieRag.Embedded VERSION $EXPECTED"
          echo "  from ${{ inputs.ref }} ($(git rev-parse --short HEAD))"
          echo "  dry_run = ${{ inputs.dry_run }}"
          echo "=============================================="

          {
            echo "## TechieRag -> NuGet.org"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`$EXPECTED\` |"
            echo "| **Ref** | \`${{ inputs.ref }}\` |"
            echo "| **Commit** | \`$(git rev-parse HEAD)\` |"
            echo "| **Dry run** | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect package contents
        # Every run self-documents exactly what shipped: the file list of each .nupkg goes into
        # the job log, so a package can be audited later without re-downloading it.
        run: |
          set -euo pipefail
          ls -la ./artifacts/
          for pkg in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            [ -e "$pkg" ] || continue
            echo ""
            echo "=============================================="
            echo "  CONTENTS OF $(basename "$pkg")"
            echo "=============================================="
            unzip -l "$pkg"
          done

      # --- Everything below is skipped entirely on a dry run -------------------------------

      - name: Dry run - stopping before publish
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run was true: no OIDC login was performed and nothing was pushed."
          echo "Version ${{ steps.pkg.outputs.version }} packed and inspected only."

      - name: NuGet.org login (OIDC -> temporary API key)
        id: login
        if: ${{ !inputs.dry_run }}
        # Runs LAST before the push on purpose: the minted key lives ~1 hour and each OIDC token
        # can be exchanged exactly once. Placing it after build/test/pack means a failing gate
        # never burns a token.
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ !inputs.dry_run }}
        # No --skip-duplicate: `Determine version` already proved this version is not on
        # nuget.org, so a 409 here is a real fault (a race with another run, or a package that
        # was pushed and rolled back) and must fail the job rather than print "skipped".
        run: |
          set -euo pipefail
          echo "Pushing TechieRag ${{ steps.pkg.outputs.version }} to $NUGET_ORG_SOURCE"
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "$NUGET_ORG_SOURCE"
